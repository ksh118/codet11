<style>
  /* 서버 슬라이더 위치 고정 및 깔끔한 여백 */
  .server-section {
    background: #fff;
    padding: 24px 0;
    margin-bottom: 8px;
  }
  
  /* 탭 메뉴 스타일 (진행중 / 종료된 이벤트) */
  .tab-container {
    display: flex;
    gap: 20px;
    margin: 20px 0;
    border-bottom: 1px solid var(--border);
  }
  .event-tab {
    padding: 12px 4px;
    font-size: 16px;
    font-weight: 700;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .event-tab.active {
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
  }
  
  .event-list-section { display: none; }
  .event-list-section.active { display: block; }
</style>

<div class="container">
  <div class="tab-container">
    <div class="event-tab active" onclick="switchEventTab('ongoing', this)">진행 중인 이벤트</div>
    <div class="event-tab" onclick="switchEventTab('ended', this)">종료된 이벤트</div>
  </div>

  <div id="section-ongoing" class="event-list-section active">
    <div class="grid" id="ongoing-grid"></div>
  </div>

  <div id="section-ended" class="event-list-section">
    <div class="grid" id="ended-grid"></div>
  </div>
</div>

<script>
function switchEventTab(type, el) {
  document.querySelectorAll('.event-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.event-list-section').forEach(s => s.classList.remove('active'));
  
  el.classList.add('active');
  document.getElementById('section-' + type).classList.add('active');
}
</script>

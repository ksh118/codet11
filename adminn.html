<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마코 관리자 - MACO Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
<style>
  body { font-family: sans-serif; background: #f2f4f6; padding: 40px; display: flex; gap: 40px; }
  .sidebar { width: 220px; }
  .tab-btn { width: 100%; padding: 15px; text-align: left; border: none; background: #fff; border-radius: 12px; margin-bottom: 10px; font-weight: 700; cursor: pointer; }
  .tab-btn.active { background: #3182f6; color: #fff; }
  .content { flex: 1; background: #fff; padding: 40px; border-radius: 24px; }
  .card { display: none; }
  .card.active { display: block; }
  input, textarea, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; }
  button.main { width: 100%; padding: 15px; background: #3182f6; color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
  .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div class="sidebar">
  <h2 style="color:#3182f6; margin-bottom:30px;">MACO Admin</h2>
  <button class="tab-btn active" onclick="showTab('tab-ev')">🎪 이벤트 관리</button>
  <button class="tab-btn" onclick="showTab('tab-cp')">🎁 쿠폰 미리등록</button>
  <button class="tab-btn" onclick="showTab('tab-sv')">🎮 서버 관리</button>
</div>

<div class="content">
  <div id="tab-ev" class="card active">
    <h3>이벤트 등록</h3>
    <input type="text" id="e-title" placeholder="제목">
    <label>이미지 업로드</label><input type="file" id="e-file">
    <textarea id="e-desc" placeholder="내용"></textarea>
    <select id="e-coupon-select"></select>
    <button class="main" onclick="saveEvent()">이벤트 저장하기</button>
    <div id="list-ev" style="margin-top:40px;"></div>
  </div>

  <div id="tab-cp" class="card">
    <h3>쿠폰 데이터 등록</h3>
    <input type="text" id="c-name" placeholder="쿠폰명">
    <button class="main" onclick="saveCoupon()">쿠폰 추가</button>
    <div id="list-cp" style="margin-top:20px;"></div>
  </div>

  <div id="tab-sv" class="card">
    <h3>서버 홍보 관리</h3>
    <input type="text" id="s-name" placeholder="서버이름">
    <input type="text" id="s-author" placeholder="제작자">
    <button class="main" onclick="saveServer()">서버 추가</button>
    <div id="list-sv" style="margin-top:20px;"></div>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDIl0-jomcfA8ykz-nYK_rYaLb-IE_yICc",
  authDomain: "codet-597c7.firebaseapp.com",
  databaseURL: "https://codet-597c7-default-rtdb.firebaseio.com",
  projectId: "codet-597c7",
  storageBucket: "codet-597c7.appspot.com",
  messagingSenderId: "619578457920",
  appId: "1:619578457920:web:52d98e7430f9b9820104a5"
});
const db = firebase.database();
const storage = firebase.storage();

function showTab(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

async function saveEvent() {
  const file = document.getElementById('e-file').files[0];
  let url = "";
  if(file) {
    const ref = storage.ref('maco/'+Date.now());
    await ref.put(file);
    url = await ref.getDownloadURL();
  }
  await db.ref('events/'+Date.now()).set({
    title: document.getElementById('e-title').value,
    img: url, desc: document.getElementById('e-desc').value,
    couponName: document.getElementById('e-coupon-select').value,
    status: 'ongoing'
  });
  alert('저장 완료'); location.reload();
}

// 쿠폰/서버 저장 로직 (기존과 동일)
async function saveCoupon() { await db.ref('coupons').push({name: document.getElementById('c-name').value}); }
async function saveServer() { await db.ref('servers').push({name: document.getElementById('s-name').value, author: document.getElementById('s-author').value}); }

// 리스트 로드 및 삭제/종료 기능
db.ref('coupons').on('value', snap => {
  const sel = document.getElementById('e-coupon-select');
  sel.innerHTML = '<option>쿠폰 선택</option>';
  snap.forEach(c => { sel.innerHTML += `<option>${c.val().name}</option>`; });
});

db.ref('events').on('value', snap => {
  const list = document.getElementById('list-ev');
  list.innerHTML = '';
  snap.forEach(e => {
    list.innerHTML += `<div class="list-item"><span>${e.val().title}</span><button onclick="db.ref('events/${e.key}').update({status:'ended'})">종료</button></div>`;
  });
});
</script>
</body>
</html>

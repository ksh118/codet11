<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마코 관리자</title>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
    body { font-family: sans-serif; background: #f2f4f6; padding: 40px; }
    .card { background: #fff; padding: 30px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #eee; }
    h2 { margin-bottom: 20px; font-size: 18px; }
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #3182f6; color: #fff; font-weight: 700; cursor: pointer; }
    .item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>

<div class="card">
    <h2>📢 공지 등록</h2>
    <input type="text" id="n-title" placeholder="공지 제목">
    <textarea id="n-content" placeholder="공지 내용"></textarea>
    <button onclick="addNotice()">공지사항 등록</button>
</div>

<div class="card">
    <h2>🎮 서버 홍보 관리 (가로 스크롤)</h2>
    <input type="text" id="s-name" placeholder="서버 이름">
    <input type="text" id="s-author" placeholder="제작자 이름">
    <button onclick="addServer()">서버 추가</button>
    <div id="admin-servers" style="margin-top:15px;"></div>
</div>

<div class="card">
    <h2>🎁 쿠폰 미리 등록</h2>
    <input type="text" id="c-name" placeholder="쿠폰/상품 이름">
    <button onclick="addCoupon()">쿠폰 데이터 추가</button>
    <div id="admin-coupons"></div>
</div>

<div class="card">
    <h2>🎪 이벤트 등록/수정</h2>
    <input type="text" id="e-title" placeholder="이벤트 제목">
    <input type="text" id="e-img" placeholder="이미지 URL">
    <textarea id="e-desc" placeholder="상세 설명"></textarea>
    <select id="e-coupon-select"><option value="">상품 선택</option></select>
    <button onclick="addEvent()">이벤트 등록/수정</button>
    <div id="admin-events" style="margin-top:20px;"></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDIl0-jomcfA8ykz-nYK_rYaLb-IE_yICc",
  authDomain: "codet-597c7.firebaseapp.com",
  databaseURL: "https://codet-597c7-default-rtdb.firebaseio.com",
  projectId: "codet-597c7",
  storageBucket: "codet-597c7.firebasestorage.app",
  messagingSenderId: "619578457920",
  appId: "1:619578457920:web:52d98e7430f9b9820104a5"
});
const db = firebase.database();

// 공지
async function addNotice() {
    await db.ref('notices').push({title: document.getElementById('n-title').value, content: document.getElementById('n-content').value});
    alert('공지 완료');
}

// 서버
async function addServer() {
    await db.ref('servers').push({name: document.getElementById('s-name').value, author: document.getElementById('s-author').value});
    alert('서버 추가 완료');
}

// 쿠폰
async function addCoupon() {
    await db.ref('coupons').push({name: document.getElementById('c-name').value});
    alert('쿠폰 등록 완료');
}

// 이벤트
async function addEvent() {
    const id = Date.now();
    await db.ref('events/'+id).set({
        title: document.getElementById('e-title').value,
        img: document.getElementById('e-img').value,
        desc: document.getElementById('e-desc').value,
        couponName: document.getElementById('e-coupon-select').value,
        status: 'ongoing',
        createdAt: id
    });
    alert('이벤트 등록 완료');
}

// 관리자 리스트 로드
db.ref('coupons').on('value', snap => {
    const sel = document.getElementById('e-coupon-select');
    sel.innerHTML = '<option value="">상품 선택</option>';
    snap.forEach(c => { sel.innerHTML += `<option value="${c.val().name}">${c.val().name}</option>`; });
});

db.ref('events').on('value', snap => {
    const list = document.getElementById('admin-events');
    list.innerHTML = '';
    snap.forEach(e => {
        list.innerHTML += `
            <div class="item">
                <span>${e.val().title}</span>
                <div>
                    <button style="background:#ff4d4f" onclick="updateEvent('${e.key}', 'ended')">즉시종료</button>
                    <button style="background:#aaa" onclick="db.ref('events/${e.key}').remove()">삭제</button>
                </div>
            </div>
        `;
    });
});

async function updateEvent(id, status) {
    await db.ref('events/'+id).update({status});
    alert('상태 변경 완료');
}
</script>
</body>
</html>

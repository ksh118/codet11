<div id="tab-ev" class="card active">
  <h3>🎪 이벤트 & 당첨자 관리</h3>
  <div id="admin-event-list" style="margin-top:40px;">
    </div>

  <div id="participant-manage" style="margin-top:40px; background:#f9fafb; padding:20px; border-radius:15px; display:none;">
    <h4>👥 참여자 목록 (클릭하여 당첨자 선정)</h4>
    <p style="font-size:12px; color:red;">* 유저를 클릭하면 즉시 당첨자로 등록되며 유저에게 팝업이 뜹니다.</p>
    <div id="user-list" style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;"></div>
  </div>
</div>

<script>
// ... (기존 설정 로직)

let selectedEventId = null;

// 이벤트 목록 로드
db.ref('events').on('value', snap => {
  const list = document.getElementById('admin-event-list');
  list.innerHTML = '<h4>이벤트 목록 (참여자 확인하려면 클릭)</h4>';
  snap.forEach(e => {
    list.innerHTML += `
      <div class="list-item" onclick="loadParticipants('${e.key}')" style="cursor:pointer; background:#fff; margin-bottom:10px;">
        <span>${e.val().title} [${e.val().status}]</span>
        <button onclick="db.ref('events/${e.key}').update({status:'ended'})">종료하기</button>
      </div>`;
  });
});

// 참여자 목록 로드 및 당첨자 선정
async function loadParticipants(id) {
  selectedEventId = id;
  const pSnap = await db.ref('participants/'+id).once('value');
  const eSnap = await db.ref('events/'+id).once('value');
  const winners = eSnap.val().winners || {};
  
  const userList = document.getElementById('user-list');
  document.getElementById('participant-manage').style.display = 'block';
  userList.innerHTML = '';
  
  pSnap.forEach(p => {
    const nick = p.val().nick;
    const isWin = winners[nick];
    userList.innerHTML += `
      <div onclick="toggleWinner('${nick}')" style="padding:10px 15px; border-radius:30px; cursor:pointer; background:${isWin?'#3182f6':'#eee'}; color:${isWin?'#fff':'#000'}; font-weight:700;">
        ${nick} ${isWin?'(당첨!)':''}
      </div>`;
  });
}

async function toggleWinner(nick) {
  const ref = db.ref(`events/${selectedEventId}/winners/${nick}`);
  const snap = await ref.once('value');
  
  if(snap.exists()) {
    await ref.remove(); // 당첨 취소
  } else {
    await ref.set({nick: nick, alerted: false}); // 당첨 등록
  }
  loadParticipants(selectedEventId);
}
</script>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>

<script>
// 기존 설정에 storageBucket이 있는지 확인하세요.
const firebaseConfig = {
  apiKey: "AIzaSyDIl0-jomcfA8ykz-nYK_rYaLb-IE_yICc",
  authDomain: "codet-597c7.firebaseapp.com",
  databaseURL: "https://codet-597c7-default-rtdb.firebaseio.com",
  projectId: "codet-597c7",
  storageBucket: "codet-597c7.appspot.com", // 본인의 버킷 주소로 확인 필요
  messagingSenderId: "619578457920",
  appId: "1:619578457920:web:52d98e7430f9b9820104a5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage(); // 스토리지 초기화

// 공통 업로드 함수
async function uploadFile(file, folder) {
  if (!file) return null;
  const storageRef = storage.ref(`${folder}/${Date.now()}_${file.name}`);
  const snapshot = await storageRef.put(file);
  return await snapshot.ref.getDownloadURL();
}

// 이벤트 저장 시 업로드 적용
async function saveEvent() {
  const fileInput = document.getElementById('e-file');
  const title = document.getElementById('e-title').value;
  
  let imgUrl = "";
  if (fileInput.files[0]) {
    alert('이미지 업로드 중...');
    imgUrl = await uploadFile(fileInput.files[0], 'events');
  }

  const id = Date.now();
  await db.ref('events/'+id).set({
    title: title,
    img: imgUrl, // 업로드된 URL 저장
    desc: document.getElementById('e-desc').value,
    couponName: document.getElementById('e-coupon-select').value,
    status: 'ongoing',
    createdAt: id
  });
  alert('이벤트가 등록되었습니다!');
  location.reload();
}
</script>

<div id="tab-event" class="card active">
  <h2>🎪 이벤트 등록</h2>
  <input type="text" id="e-title" placeholder="이벤트 제목">
  <div style="margin-bottom:16px;">
    <label style="font-size:12px; color:#666;">배너 이미지 업로드</label>
    <input type="file" id="e-file" accept="image/*">
  </div>
  <textarea id="e-desc" placeholder="상세 내용"></textarea>
  <select id="e-coupon-select"></select>
  <button class="submit" onclick="saveEvent()">이벤트 저장하기</button>
</div>

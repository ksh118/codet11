<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마코 - MACO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --border: #E5E8EB;
  --text: #191F28; --text2: #4E5968; --text3: #8B95A1;
  --accent: #3182F6; --r: 20px; --gold: #FFD700;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; letter-spacing: -0.5px; }
body { background: var(--bg); color: var(--text); line-height: 1.5; overflow-x: hidden; }

/* Header */
.header { height: 64px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); gap: 12px; }
.logo { font-size: 22px; font-weight: 900; color: var(--accent); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.logout-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 700; color: var(--text2); cursor: pointer; transition: 0.2s; }
.logout-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

/* Notice Bar */
.notice-bar { background: var(--accent); color: #fff; padding: 12px 24px; font-size: 14px; font-weight: 600; display: none; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
.notice-bar:hover { background: #1d6fe0; }

/* Server Slider */
.server-section { background: #fff; padding: 24px 0; border-bottom: 1px solid var(--border); overflow: hidden; }
.slider-title { max-width: 1000px; margin: 0 auto 12px; padding: 0 24px; font-size: 13px; font-weight: 700; color: var(--text3); }
.server-viewport { display: flex; overflow: hidden; width: 100%; }
.server-track { display: flex; gap: 16px; animation: scroll 40s linear infinite; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.server-card { background: var(--bg); padding: 16px 24px; border-radius: 16px; min-width: 220px; flex-shrink: 0; }

/* Tabs */
.tab-container { display: flex; gap: 20px; margin: 24px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.event-tab { padding: 12px 8px; font-size: 15px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: 0.2s; }
.event-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

.container { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; }
.event-section { display: none; }
.event-section.active { display: block; }

/* Grid & Cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.card { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.04); cursor: pointer; transition: 0.3s; position: relative; }
.card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }
.card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
.card-content { padding: 20px; }
.winner-badge { position: absolute; top: 12px; right: 12px; background: var(--gold); color: #000; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; z-index: 2; }
.ended-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.55); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; z-index: 2; }
.empty-msg { padding: 60px 20px; text-align: center; color: var(--text3); font-size: 15px; }

/* Win Popup */
#win-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3000; display: none; align-items: center; justify-content: center; text-align: center; }
.win-box { background: #fff; color: #000; padding: 40px; border-radius: 32px; max-width: 360px; width: 90%; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes pop { from { transform: scale(0.5); opacity:0; } to { transform: scale(1); opacity:1; } }
.confetti { font-size: 48px; margin-bottom: 10px; }

/* Notice Popup */
#notice-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500; display: none; align-items: center; justify-content: center; }
.notice-box { background: #fff; border-radius: 24px; max-width: 420px; width: 90%; padding: 32px; }

/* CS iframe popup */
#cs-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 4000; display: none; align-items: center; justify-content: center; }
.cs-box { background: #fff; border-radius: 24px; overflow: hidden; width: 90%; max-width: 500px; height: 70vh; display: flex; flex-direction: column; }
.cs-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
.cs-close { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text3); }
.cs-box iframe { flex: 1; border: none; }

/* CS Section */
.cs-section { margin-top: 60px; padding: 30px; background: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; }
.cs-btn { padding: 14px 20px; border-radius: 12px; border: none; background: var(--bg); font-weight: 700; cursor: pointer; transition: 0.2s; }
.cs-btn:hover { background: #e1e8f0; }

/* Auth Area */
#auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
.auth-box { background: #fff; padding: 40px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
.auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: #F9FAFB; font-size: 15px; transition: 0.2s; }
.auth-input:focus { border-color: var(--accent); }

/* Modal */
#modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); padding:20px; }
#modal-content { background:#fff; width:100%; max-width:480px; border-radius:28px; padding:30px; position:relative; max-height:90vh; overflow-y:auto; }

/* Winners list in modal */
.winner-list-box { background: linear-gradient(135deg, #FFF9E5, #FFFDE7); padding: 18px; border-radius: 14px; margin: 15px 0; border: 1.5px solid #FFE082; }
.winner-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.winner-chip { background: var(--gold); color: #000; padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 700; }

/* Participants box in modal */
.participants-box { background: var(--bg); padding: 16px; border-radius: 12px; margin: 12px 0; }
.participant-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; max-height: 120px; overflow-y: auto; }
.participant-chip { background: #fff; border: 1px solid var(--border); color: var(--text2); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>

<!-- Win Popup -->
<div id="win-popup">
  <div class="win-box">
    <div class="confetti">🎉🏆🎉</div>
    <h2 style="font-size: 24px; font-weight: 900; margin: 10px 0;">당첨 되었습니다!</h2>
    <p id="win-msg" style="color: var(--text2); margin-bottom: 8px;"></p>
    <p style="font-size: 13px; color: var(--text3); margin-bottom: 25px;">당첨 내역 탭에서 확인하실 수 있습니다.</p>
    <button onclick="document.getElementById('win-popup').style.display='none'" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; font-size:15px;">확인</button>
  </div>
</div>

<!-- Notice Popup -->
<div id="notice-popup" onclick="if(event.target===this)this.style.display='none'">
  <div class="notice-box">
    <h3 id="np-title" style="font-size:18px; font-weight:900; margin-bottom:16px;"></h3>
    <p id="np-content" style="color:var(--text2); line-height:1.8; white-space:pre-wrap;"></p>
    <button onclick="document.getElementById('notice-popup').style.display='none'" style="width:100%; margin-top:24px; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer;">닫기</button>
  </div>
</div>

<!-- CS Popup (채널톡 iframe) -->
<div id="cs-popup" onclick="if(event.target===this)closeCS()">
  <div class="cs-box">
    <div class="cs-header">
      <span>🎧 고객센터 문의</span>
      <button class="cs-close" onclick="closeCS()">✕</button>
    </div>
    <iframe src="https://codet.channel.io/home" id="cs-iframe" title="고객센터"></iframe>
  </div>
</div>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="logo" style="margin-bottom: 30px; font-size: 28px;">마코</div>
    <input type="text" id="user-nick" class="auth-input" placeholder="마인크래프트 닉네임">
    <div id="join-only" style="display:none;">
      <input type="text" id="user-discord" class="auth-input" placeholder="디스코드 사용자명">
    </div>
    <input type="password" id="user-pw" class="auth-input" placeholder="비밀번호 (숫자)">
    <button onclick="handleAuth()" style="width:100%; padding:16px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; font-size:16px;">시작하기</button>
    <p onclick="toggleAuth()" id="auth-msg" style="margin-top:20px; font-size:13px; color:var(--text3); cursor:pointer;">계정이 없으신가요? 회원가입</p>
  </div>
</div>

<!-- Notice Bar -->
<div id="notice-bar" class="notice-bar">
  <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:4px; font-size:11px;">공지</span>
  <span id="notice-text">불러오는 중...</span>
</div>

<!-- Header -->
<div class="header">
  <div class="logo">마코</div>
  <div class="header-right">
    <div id="user-display" style="font-size:14px; font-weight:700; color:var(--text2);"></div>
    <button class="logout-btn" onclick="logout()">로그아웃</button>
  </div>
</div>

<!-- Server Slider -->
<div class="server-section">
  <div class="slider-title">참여 가능 서버</div>
  <div class="server-viewport"><div class="server-track" id="server-track"></div></div>
</div>

<!-- Main -->
<div class="container">
  <div class="tab-container">
    <div class="event-tab active" onclick="switchTab('ongoing', this)">진행 중인 이벤트</div>
    <div class="event-tab" onclick="switchTab('ended', this)">종료된 이벤트</div>
    <div class="event-tab" style="color:#FF9500" onclick="switchTab('mywin', this)">🏆 나의 당첨 내역</div>
  </div>

  <div id="tab-ongoing" class="event-section active"><div class="grid" id="ongoing-grid"></div></div>
  <div id="tab-ended" class="event-section"><div class="grid" id="ended-grid"></div></div>
  <div id="tab-mywin" class="event-section"><div class="grid" id="mywin-grid"></div></div>

  <div class="cs-section">
    <div>
      <b style="font-size:16px;">문제가 생기셨나요?</b>
      <p style="font-size:14px; color:var(--text2); margin-top:4px;">쿠폰이 디스코드 DM으로 발송이 안되었나요? 고객센터에 문의하세요!</p>
    </div>
    <button class="cs-btn" onclick="openCS()">🎧 고객센터 문의</button>
  </div>
</div>

<!-- Event Modal -->
<div id="modal" onclick="if(event.target===this)this.style.display='none'">
  <div id="modal-content"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDIl0-jomcfA8ykz-nYK_rYaLb-IE_yICc",
  authDomain: "codet-597c7.firebaseapp.com",
  databaseURL: "https://codet-597c7-default-rtdb.firebaseio.com",
  projectId: "codet-597c7",
  storageBucket: "codet-597c7.appspot.com",
  messagingSenderId: "619578457920",
  appId: "1:619578457920:web:52d98e7430f9b9820104a5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let isJoin = false;
let user = null;

/* ─── Auth ─── */
function toggleAuth() {
  isJoin = !isJoin;
  document.getElementById('join-only').style.display = isJoin ? 'block' : 'none';
  document.getElementById('auth-msg').innerText = isJoin ? '이미 계정이 있나요? 로그인' : '계정이 없으신가요? 회원가입';
}

async function handleAuth() {
  const nick = document.getElementById('user-nick').value.trim();
  const pw = document.getElementById('user-pw').value.trim();
  if(!nick || !pw) return alert('모두 입력해주세요.');
  if(isJoin) {
    const discord = document.getElementById('user-discord').value.trim();
    const existing = await db.ref('users/'+nick).once('value');
    if(existing.exists()) return alert('이미 존재하는 닉네임입니다.');
    await db.ref('users/'+nick).set({pw, discord});
    user = {nick, discord};
  } else {
    const snap = await db.ref('users/'+nick).once('value');
    if(!snap.exists() || snap.val().pw !== pw) return alert('닉네임 또는 비밀번호가 올바르지 않습니다.');
    user = {nick, discord: snap.val().discord};
  }
  localStorage.setItem('maco_session', JSON.stringify(user));
  location.reload();
}

function logout() {
  if(!confirm('로그아웃 하시겠습니까?')) return;
  localStorage.removeItem('maco_session');
  location.reload();
}

/* ─── Init ─── */
window.onload = () => {
  const saved = localStorage.getItem('maco_session');
  if(saved) {
    user = JSON.parse(saved);
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('user-display').innerText = user.nick + '님 환영합니다';
    loadContent();
    checkWinner();
  }
};

/* ─── Tab ─── */
function switchTab(type, el) {
  document.querySelectorAll('.event-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.event-section').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+type).classList.add('active');
}

/* ─── Content Load ─── */
function loadContent() {
  // 공지
  db.ref('notices').limitToLast(1).on('value', snap => {
    const bar = document.getElementById('notice-bar');
    let found = false;
    snap.forEach(n => {
      found = true;
      bar.style.display = 'flex';
      document.getElementById('notice-text').innerText = n.val().title;
      bar.onclick = () => {
        document.getElementById('np-title').innerText = n.val().title;
        document.getElementById('np-content').innerText = n.val().content;
        document.getElementById('notice-popup').style.display = 'flex';
      };
    });
    if(!found) bar.style.display = 'none';
  });

  // 서버 트랙
  db.ref('servers').on('value', snap => {
    const track = document.getElementById('server-track');
    let html = '';
    snap.forEach(s => {
      html += `<div class="server-card"><b>${s.val().name}</b><p style="font-size:12px;color:var(--text3);margin-top:4px;">${s.val().author}</p></div>`;
    });
    if(!html) html = '<div class="server-card"><b>서버가 없습니다</b></div>';
    track.innerHTML = html + html;
  });

  // 이벤트
  db.ref('events').on('value', snap => {
    const ongoing = document.getElementById('ongoing-grid');
    const ended = document.getElementById('ended-grid');
    const mywin = document.getElementById('mywin-grid');
    ongoing.innerHTML = ended.innerHTML = mywin.innerHTML = '';
    let ongoingCnt = 0, endedCnt = 0, mywinCnt = 0;

    snap.forEach(e => {
      const ev = e.val();
      const isEnd = ev.status === 'ended';
      const isWin = ev.winners && ev.winners[user.nick];
      const card = `<div class="card" onclick="openEvent('${e.key}')">
        ${isWin ? '<div class="winner-badge">🏆 나의 당첨</div>' : ''}
        ${isEnd ? '<div class="ended-badge">종료</div>' : ''}
        <img src="${ev.img || 'https://placehold.co/400x225/e5e8eb/8b95a1?text=이미지없음'}" class="card-img" onerror="this.src='https://placehold.co/400x225/e5e8eb/8b95a1?text=이미지없음'">
        <div class="card-content">
          <h3 style="font-size:17px;font-weight:800;">${ev.title}</h3>
          <p style="font-size:13px;color:var(--text3);margin-top:6px;">${ev.couponName ? '🎁 ' + ev.couponName : ''}</p>
        </div>
      </div>`;
      if(isEnd) { ended.innerHTML += card; endedCnt++; }
      else { ongoing.innerHTML += card; ongoingCnt++; }
      if(isWin) { mywin.innerHTML += card; mywinCnt++; }
    });

    if(!ongoingCnt) ongoing.innerHTML = '<div class="empty-msg">진행 중인 이벤트가 없습니다 😢</div>';
    if(!endedCnt) ended.innerHTML = '<div class="empty-msg">종료된 이벤트가 없습니다.</div>';
    if(!mywinCnt) mywin.innerHTML = '<div class="empty-msg">아직 당첨 내역이 없습니다 🍀<br><small>이벤트에 참여해보세요!</small></div>';
  });
}

/* ─── Event Modal ─── */
async function openEvent(id) {
  const [evSnap, partSnap] = await Promise.all([
    db.ref('events/'+id).once('value'),
    db.ref('participants/'+id).once('value')
  ]);
  const ev = evSnap.val();
  const winners = ev.winners ? Object.keys(ev.winners) : [];
  const participants = [];
  partSnap.forEach(p => participants.push(p.val().nick));

  const isEnd = ev.status === 'ended';
  const myJoined = participants.includes(user.nick);
  const myWin = ev.winners && ev.winners[user.nick];
  const modal = document.getElementById('modal-content');

  let winnersHtml = '';
  if(isEnd) {
    const chips = winners.length ? winners.map(n => `<span class="winner-chip">🏆 ${n}</span>`).join('') : '<span style="color:var(--text3)">아직 발표 전입니다.</span>';
    winnersHtml = `<div class="winner-list-box"><b>🏆 당첨자 명단</b><div class="winner-chips">${chips}</div></div>`;
  }

  let participantsHtml = '';
  if(participants.length) {
    const chips = participants.map(n => {
      const isWinner = winners.includes(n);
      return `<span class="participant-chip" style="${isWinner?'background:var(--gold);border-color:var(--gold);font-weight:800;':''}">
        ${isWinner?'🏆 ':''}${n}
      </span>`;
    }).join('');
    participantsHtml = `<div class="participants-box">
      <b style="font-size:13px;color:var(--text2);">참여자 ${participants.length}명</b>
      <div class="participant-chips">${chips}</div>
    </div>`;
  }

  modal.innerHTML = `
    <img src="${ev.img || 'https://placehold.co/400x225/e5e8eb/8b95a1?text=이미지없음'}" 
      onerror="this.src='https://placehold.co/400x225/e5e8eb/8b95a1?text=이미지없음'"
      style="width:100%; border-radius:15px; margin-bottom:20px; aspect-ratio:16/9; object-fit:cover; background:#eee;">
    <h2 style="font-weight:900; font-size:20px;">${ev.title}</h2>
    ${myWin ? '<div style="background:#E8F4FF; padding:12px 16px; border-radius:10px; margin:12px 0; color:var(--accent); font-weight:700;">🎉 나는 이 이벤트에 당첨되었습니다!</div>' : ''}
    ${winnersHtml}
    ${participantsHtml}
    <p style="margin:16px 0; color:var(--text2); white-space:pre-wrap; line-height:1.8;">${ev.desc || ''}</p>
    <div style="background:var(--bg); padding:16px; border-radius:12px; margin-bottom:20px;"><b>🎁 증정 상품:</b> ${ev.couponName || '미정'}</div>
    ${!isEnd
      ? `<button onclick="joinEvent('${id}', ${myJoined})" style="width:100%; padding:16px; border-radius:14px; border:none; background:${myJoined?'#eee':'var(--accent)'}; color:${myJoined?'var(--text3)':'#fff'}; font-weight:700; cursor:pointer; font-size:15px;">
          ${myJoined ? '✅ 이미 참여 완료' : '참여하기'}
        </button>`
      : `<button style="width:100%; padding:16px; border-radius:14px; border:none; background:#eee; color:var(--text3); font-weight:700; cursor:default; font-size:15px;">종료된 이벤트</button>`
    }
  `;
  document.getElementById('modal').style.display = 'flex';
}

async function joinEvent(id, alreadyJoined) {
  if(alreadyJoined) return alert('이미 참여한 이벤트입니다.');
  const ev = (await db.ref('events/'+id).once('value')).val();
  if(ev.status === 'ended') return alert('이미 종료된 이벤트입니다.');
  await db.ref(`participants/${id}/${user.nick}`).set({nick: user.nick, time: Date.now()});
  alert('이벤트 참여가 완료되었습니다! 🎉');
  document.getElementById('modal').style.display = 'none';
}

/* ─── Winner Check ─── */
function checkWinner() {
  db.ref('events').on('child_changed', snap => {
    const ev = snap.val();
    if(ev.winners && ev.winners[user.nick] && !ev.winners[user.nick].alerted) {
      document.getElementById('win-msg').innerText = `[${ev.title}] 이벤트에 당첨되셨습니다! 🎊`;
      document.getElementById('win-popup').style.display = 'flex';
      db.ref(`events/${snap.key}/winners/${user.nick}`).update({alerted: true});
    }
  });
}

/* ─── CS Popup ─── */
function openCS() {
  document.getElementById('cs-popup').style.display = 'flex';
}
function closeCS() {
  document.getElementById('cs-popup').style.display = 'none';
}
</script>
</body>

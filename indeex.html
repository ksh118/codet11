<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마코 - MACO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --border: #E5E8EB;
  --text: #191F28; --text2: #4E5968; --text3: #8B95A1;
  --accent: #3182F6; --r: 20px; --gold: #FFD700;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
body { background: var(--bg); color: var(--text); line-height: 1.5; overflow-x: hidden; }

/* Header */
.header { height: 64px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
.logo { font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: -1px; }

/* Tabs */
.tab-container { display: flex; gap: 20px; margin: 24px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
.event-tab { padding: 12px 8px; font-size: 15px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.event-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

.container { max-width: 1000px; margin: 0 auto; padding: 0 24px 80px; }
.event-section { display: none; }
.event-section.active { display: block; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.card { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.04); cursor: pointer; transition: 0.3s; position: relative; }
.card:hover { transform: translateY(-5px); }
.card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.winner-badge { position: absolute; top: 12px; right: 12px; background: var(--gold); color: #000; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; border: 1px solid rgba(0,0,0,0.1); }

/* Win Popup */
#win-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 3000; display: none; align-items: center; justify-content: center; text-align: center; color: #fff; }
.win-box { background: #fff; color: #000; padding: 40px; border-radius: 32px; max-width: 350px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }

/* CSS Common */
.btn-p { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<div id="win-popup">
  <div class="win-box">
    <div style="font-size: 50px;">🎉</div>
    <h2 style="font-size: 24px; font-weight: 900; margin: 15px 0;">당첨 되었습니다!</h2>
    <p id="win-msg" style="color: var(--text2); margin-bottom: 25px;"></p>
    <button class="btn-p" onclick="document.getElementById('win-popup').style.display='none'">확인</button>
  </div>
</div>

<div class="header"><div class="logo">마코</div><div id="user-display" style="margin-left:auto; font-size:14px; font-weight:700;"></div></div>

<div class="container">
  <div class="tab-container">
    <div class="event-tab active" onclick="switchTab('ongoing', this)">진행 중</div>
    <div class="event-tab" onclick="switchTab('ended', this)">종료된 이벤트</div>
    <div class="event-tab" style="color:#FF9500" onclick="switchTab('mywin', this)">🏆 나의 당첨 내역</div>
  </div>

  <div id="tab-ongoing" class="event-section active"><div class="grid" id="ongoing-grid"></div></div>
  <div id="tab-ended" class="event-section"><div class="grid" id="ended-grid"></div></div>
  <div id="tab-mywin" class="event-section"><div class="grid" id="mywin-grid"></div></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('active')" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div class="modal-content" id="modal-content" style="background:#fff; width:90%; max-width:450px; border-radius:28px; padding:30px;"></div>
</div>

<script>
firebase.initializeApp({ /* 여기에 본인의 파이어베이스 설정을 넣으세요 */ });
const db = firebase.database();
const user = JSON.parse(localStorage.getItem('maco_session'));

if(!user) { location.href = 'login.html'; } // 로그인 안되어있으면 로그인으로

window.onload = () => {
    document.getElementById('user-display').innerText = user.nick + '님';
    loadData();
    checkWinner(); // 로그인 시 당첨 여부 실시간 확인
};

function switchTab(type, el) {
  document.querySelectorAll('.event-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.event-section').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+type).classList.add('active');
}

function loadData() {
  db.ref('events').on('value', snap => {
    const ongoing = document.getElementById('ongoing-grid');
    const ended = document.getElementById('ended-grid');
    const mywin = document.getElementById('mywin-grid');
    ongoing.innerHTML = ended.innerHTML = mywin.innerHTML = '';

    snap.forEach(e => {
      const ev = e.val();
      const isEnd = ev.status === 'ended';
      const isWin = ev.winners && ev.winners[user.nick];
      
      const card = `
        <div class="card" onclick="openEvent('${e.key}')">
          ${isWin ? '<div class="winner-badge">나의 당첨</div>' : ''}
          <img src="${ev.img}" class="card-img">
          <div class="card-content"><h3>${ev.title}</h3></div>
        </div>`;

      if(isEnd) ended.innerHTML += card;
      else ongoing.innerHTML += card;

      if(isWin) mywin.innerHTML += card;
    });
  });
}

// 당첨 여부 확인 및 팝업
async function checkWinner() {
  db.ref('events').on('child_changed', snap => {
    const ev = snap.val();
    if(ev.winners && ev.winners[user.nick] && !ev.winners[user.nick].alerted) {
      document.getElementById('win-msg').innerText = `[${ev.title}] 이벤트에 당첨되셨습니다!`;
      document.getElementById('win-popup').style.display = 'flex';
      // 확인한 알림으로 처리 (중복 팝업 방지)
      db.ref(`events/${snap.key}/winners/${user.nick}`).update({alerted: true});
    }
  });
}

async function openEvent(id) {
  const ev = (await db.ref('events/'+id).once('value')).val();
  const winners = ev.winners ? Object.keys(ev.winners).join(', ') : '아직 발표 전입니다.';
  
  document.getElementById('modal-content').innerHTML = `
    <img src="${ev.img}" style="width:100%; border-radius:15px; margin-bottom:20px;">
    <h2>${ev.title}</h2>
    ${ev.status === 'ended' ? `<div style="background:#FFF9E5; padding:15px; border-radius:12px; margin:15px 0; border:1px solid #FFE082;">
        <b>축하합니다! 당첨자 명단:</b><br>${winners}</div>` : ''}
    <p style="margin:15px 0; color:var(--text2);">${ev.desc}</p>
    <button class="btn-p" onclick="joinEvent('${id}')">${ev.status==='ended'?'종료된 이벤트':'참여하기'}</button>
  `;
  document.getElementById('modal').style.display = 'flex';
}
</script>
</body>
</html>

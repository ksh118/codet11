<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마코 - MACO</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --border: #E5E8EB;
  --text: #191F28; --text2: #4E5968; --text3: #8B95A1;
  --accent: #3182F6; --r: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
body { background: var(--bg); color: var(--text); line-height: 1.5; overflow-x: hidden; }

/* Header & Logo */
.header { height: 64px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
.logo { font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: -1px; }

/* Server Slider */
.server-section { background: #fff; padding: 24px 0; border-bottom: 1px solid var(--border); overflow: hidden; }
.slider-title { max-width: 1000px; margin: 0 auto 12px; padding: 0 24px; font-size: 13px; font-weight: 700; color: var(--text3); }
.server-viewport { display: flex; overflow: hidden; width: 100%; }
.server-track { display: flex; gap: 16px; animation: scroll 30s linear infinite; }
@keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.server-card { background: var(--bg); padding: 16px 24px; border-radius: 16px; min-width: 220px; flex-shrink: 0; }

/* Tabs */
.tab-container { display: flex; gap: 24px; margin: 32px 0 20px; border-bottom: 1px solid var(--border); }
.event-tab { padding: 12px 4px; font-size: 17px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; }
.event-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

/* Layout & Grid */
.container { max-width: 1000px; margin: 0 auto; padding: 0 24px 60px; }
.event-section { display: none; }
.event-section.active { display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
.card { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.04); cursor: pointer; transition: 0.3s; }
.card:hover { transform: translateY(-6px); }
.card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
.card-content { padding: 20px; }

/* Customer Service Section */
.cs-section { margin-top: 80px; padding: 40px; background: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.cs-text b { font-size: 18px; display: block; margin-bottom: 4px; }
.cs-text p { font-size: 14px; color: var(--text2); }
.cs-btn { padding: 16px 28px; background: var(--bg); border: none; border-radius: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal.active { display: flex; }
.modal-content { background: #fff; width: 90%; max-width: 500px; border-radius: 28px; padding: 32px; max-height: 85vh; overflow-y: auto; position: relative; }

/* Auth */
#auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
.auth-box { background: #fff; padding: 40px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; }
.auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 12px; outline: none; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <div class="logo" style="margin-bottom: 30px;">마코</div>
    <input type="text" id="user-nick" class="auth-input" placeholder="마인크래프트 닉네임">
    <div id="join-only" style="display:none;"><input type="text" id="user-discord" class="auth-input" placeholder="디스코드 사용자명"></div>
    <input type="password" id="user-pw" class="auth-input" placeholder="비밀번호 (숫자 4~10자)">
    <button onclick="handleAuth()" style="width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700; cursor:pointer;">시작하기</button>
    <p onclick="toggleAuth()" id="auth-msg" style="margin-top:20px; font-size:13px; color:var(--text3); cursor:pointer;">계정이 없으신가요? 회원가입</p>
  </div>
</div>

<div class="header">
  <div class="logo">마코</div>
  <div id="user-display" style="margin-left:auto; font-size:14px; font-weight:700;"></div>
</div>

<div class="server-section">
  <div class="slider-title">참여 가능 서버</div>
  <div class="server-viewport"><div class="server-track" id="server-track"></div></div>
</div>

<div class="container">
  <div class="tab-container">
    <div class="event-tab active" onclick="switchTab('ongoing', this)">진행 중인 이벤트</div>
    <div class="event-tab" onclick="switchTab('ended', this)">종료된 이벤트</div>
  </div>

  <div id="tab-ongoing" class="event-section active"><div class="grid" id="ongoing-grid"></div></div>
  <div id="tab-ended" class="event-section"><div class="grid" id="ended-grid"></div></div>

  <div class="cs-section">
    <div class="cs-text">
      <b>문제가 생기셨나요?</b>
      <p>쿠폰이 디스코드 DM으로 발송이 안되었나요? 고객센터에 문의하세요!</p>
    </div>
    <button class="cs-btn" onclick="window.open('https://discord.gg/yourlink')">🎧 고객센터 문의하기</button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal-content" id="modal-content"></div>
</div>

<script>
// Firebase Config (본인의 설정값 확인)
firebase.initializeApp({
  apiKey: "AIzaSyDIl0-jomcfA8ykz-nYK_rYaLb-IE_yICc",
  authDomain: "codet-597c7.firebaseapp.com",
  databaseURL: "https://codet-597c7-default-rtdb.firebaseio.com",
  projectId: "codet-597c7",
  storageBucket: "codet-597c7.appspot.com",
  messagingSenderId: "619578457920",
  appId: "1:619578457920:web:52d98e7430f9b9820104a5"
});
const db = firebase.database();
let isJoin = false;
let user = null;

function toggleAuth() {
  isJoin = !isJoin;
  document.getElementById('join-only').style.display = isJoin ? 'block' : 'none';
  document.getElementById('auth-msg').innerText = isJoin ? '이미 계정이 있나요? 로그인' : '계정이 없으신가요? 회원가입';
}

async function handleAuth() {
  const nick = document.getElementById('user-nick').value;
  const pw = document.getElementById('user-pw').value;
  if(isJoin) {
    const discord = document.getElementById('user-discord').value;
    await db.ref('users/'+nick).set({pw, discord});
    user = {nick, discord};
  } else {
    const snap = await db.ref('users/'+nick).once('value');
    if(!snap.exists() || snap.val().pw !== pw) return alert('정보가 틀립니다.');
    user = {nick, discord: snap.val().discord};
  }
  localStorage.setItem('maco_session', JSON.stringify(user));
  location.reload();
}

window.onload = () => {
  const saved = localStorage.getItem('maco_session');
  if(saved) {
    user = JSON.parse(saved);
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('user-display').innerText = user.nick + '님';
    loadData();
  }
};

function switchTab(type, el) {
  document.querySelectorAll('.event-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.event-section').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+type).classList.add('active');
}

function loadData() {
  db.ref('servers').on('value', snap => {
    const track = document.getElementById('server-track');
    let html = '';
    snap.forEach(s => { html += `<div class="server-card"><b>${s.val().name}</b><p style="font-size:12px; color:var(--text3)">${s.val().author}</p></div>`; });
    track.innerHTML = html + html;
  });

  db.ref('events').on('value', snap => {
    const ongoing = document.getElementById('ongoing-grid');
    const ended = document.getElementById('ended-grid');
    ongoing.innerHTML = ended.innerHTML = '';
    snap.forEach(e => {
      const ev = e.val();
      const isEnd = ev.status === 'ended';
      const card = `<div class="card" onclick="openEvent('${e.key}')"><img src="${ev.img}" class="card-img"><div class="card-content"><h3 style="font-size:18px;">${ev.title}</h3></div></div>`;
      if(isEnd) ended.innerHTML += card; else ongoing.innerHTML += card;
    });
  });
}

async function openEvent(id) {
  const ev = (await db.ref('events/'+id).once('value')).val();
  const parts = await db.ref('participants/'+id).once('value');
  let partList = '';
  parts.forEach(p => { partList += `<li>${p.val().nick}</li>`; });

  document.getElementById('modal-content').innerHTML = `
    <img src="${ev.img}" style="width:100%; border-radius:15px; margin-bottom:20px;">
    <h2>${ev.title}</h2>
    <p style="margin:15px 0; color:var(--text2);">${ev.desc}</p>
    <div style="background:var(--bg); padding:15px; border-radius:12px; margin-bottom:20px;"><b>증정 쿠폰:</b> ${ev.couponName}</div>
    <button onclick="joinEvent('${id}')" style="width:100%; padding:15px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:700;">참여하기</button>
    <div style="margin-top:25px;"><h4>참여자 명단</h4><ul style="font-size:13px; color:var(--text3); margin-top:10px; display:grid; grid-template-columns:1fr 1fr;">${partList || '없음'}</ul></div>
  `;
  document.getElementById('modal').classList.add('active');
}

async function joinEvent(id) {
  await db.ref(`participants/${id}/${user.nick}`).set({nick: user.nick, time: Date.now()});
  alert('참여되었습니다!');
  openEvent(id);
}
</script>
</body>
</html>
